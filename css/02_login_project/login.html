<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <style>
      body {
        font-family: Arial, Helvetica, sans-serif;
        background-color: #1a1a1a;
        margin: 0;
        padding: 0;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      .card {
        background-color: #cbcbcb;
        border-radius: 8px;
        padding: 30px;
        width: 250px;
      }
      h2 {
        color: #13a1ff;
        text-align: center;
        margin-bottom: 20px;
      }
      form {
        display: flex;
        flex-direction: column;
        /* gap: 3px; */
      }
      input {
        margin-bottom: 10px;
        padding: 10px;
        border-radius: 5px;
        border: 1px solid rgb(134, 132, 132);
        background-color: #cdcdcd;
      }
      button {
        background-color: #1b81da;
        color: white;
        padding: 10px;
        border-radius: 8px;
      }
      button:hover {
        background-color: #063a68;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h2>Login</h2>
      <form>
        <input type="email" name="" id="" placeholder="Email" />
        <input type="password" name="" id="" placeholder="Password" />
        <button type="submit">Login</button>
      </form>
    </div>
  </body>
</html>
